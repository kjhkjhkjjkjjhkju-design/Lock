name: Lock APK
on:
  workflow_dispatch:
  push:
    branches: ['**']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Proje dosyalarini olustur
        run: |
          mkdir -p p/app/src/main/java/com/vys/lock p/app/src/main/res/values p/app/src/main/res/xml
          cat > p/app/build.gradle <<'EOF_X'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.vys.lock'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.vys.lock'
                  minSdk 21
                  targetSdk 34
                  versionCode 2
                  versionName '2.0'
              }
              buildTypes {
                  release {
                      minifyEnabled true
                      shrinkResources true
                      signingConfig signingConfigs.debug
                  }
              }
              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF_X
          cat > p/app/src/main/AndroidManifest.xml <<'EOF_X'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                  </intent>
              </queries>
              <application
                  android:label="Lock"
                  android:allowBackup="false"
                  android:theme="@style/T">
                  <activity android:name=".SettingsActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.INFO" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.APPLICATION_PREFERENCES" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>
                  <activity android:name=".PinActivity" android:exported="false" android:excludeFromRecents="true" />
                  <service
                      android:name=".LockService"
                      android:exported="true"
                      android:label="Lock"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data android:name="android.accessibilityservice" android:resource="@xml/accessibility" />
                  </service>
              </application>
          </manifest>
          EOF_X
          cat > p/app/src/main/java/com/vys/lock/LockService.java <<'EOF_X'
          package com.vys.lock;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.AccessibilityServiceInfo;
          import android.content.Intent;
          import android.content.pm.ResolveInfo;
          import android.view.accessibility.AccessibilityEvent;
          import java.util.LinkedHashSet;

          public class LockService extends AccessibilityService {
              static volatile String unlocked;
              static volatile boolean showing;
              static volatile LockService inst;
              volatile boolean wide;
              String[] homes = new String[0];

              @Override
              protected void onServiceConnected() {
                  inst = this;
                  wide = false;
                  try {
                      LinkedHashSet<String> s = new LinkedHashSet<String>();
                      for (ResolveInfo r : getPackageManager().queryIntentActivities(
                              new Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_HOME), 0)) {
                          s.add(r.activityInfo.packageName);
                      }
                      homes = s.toArray(new String[0]);
                  } catch (Exception e) { }
                  apply();
                  if (!Store.hasPin(this)) openPin(PinActivity.CREATE_FIRST, null);
              }

              @Override
              public boolean onUnbind(Intent i) {
                  inst = null;
                  return super.onUnbind(i);
              }

              // Dinlenen paketler: kilitli uygulamalar + ana ekran. Kilit açıkken geçici olarak hepsi.
              void apply() {
                  try {
                      AccessibilityServiceInfo i = getServiceInfo();
                      if (i == null) return;
                      if (wide || homes.length == 0) {
                          i.packageNames = null;
                      } else {
                          LinkedHashSet<String> n = new LinkedHashSet<String>(Store.load(this));
                          for (String x : homes) n.add(x);
                          i.packageNames = n.toArray(new String[0]);
                      }
                      setServiceInfo(i);
                  } catch (Exception ex) { }
              }

              void widen() {
                  wide = true;
                  apply();
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent e) {
                  try {
                      CharSequence cs = e.getPackageName();
                      if (cs == null) return;
                      String p = cs.toString();
                      if (p.equals(getPackageName()) || p.equals("com.android.systemui") || p.equals("android")) return;
                      CharSequence cn = e.getClassName();
                      if (cn != null && cn.toString().equals("android.inputmethodservice.SoftInputWindow")) return;
                      if (p.equals(unlocked)) return;
                      if (Store.isLocked(this, p)) {
                          if (!showing) {
                              showing = true;
                              unlocked = null;
                              openPin(PinActivity.UNLOCK, p);
                          }
                      } else {
                          unlocked = null;
                          if (wide && !showing) {
                              wide = false;
                              apply();
                          }
                      }
                  } catch (Exception ex) { }
              }

              void openPin(int mode, String pkg) {
                  try {
                      startActivity(new Intent(this, PinActivity.class)
                              .putExtra("m", mode).putExtra("p", pkg)
                              .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_NO_ANIMATION
                                      | Intent.FLAG_ACTIVITY_EXCLUDE_FROM_RECENTS));
                  } catch (Exception ex) {
                      showing = false;
                  }
              }

              @Override
              public void onInterrupt() {}
          }
          EOF_X
          cat > p/app/src/main/java/com/vys/lock/PinActivity.java <<'EOF_X'
          package com.vys.lock;

          import android.animation.Animator;
          import android.animation.AnimatorListenerAdapter;
          import android.animation.ObjectAnimator;
          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.KeyEvent;
          import android.view.View;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class PinActivity extends Activity {
              static final int UNLOCK = 0, VERIFY = 1, CREATE = 2, CREATE_FIRST = 3;
              static final String[][] ROWS = {{"1", "2", "3"}, {"4", "5", "6"}, {"7", "8", "9"}, {"←", "0", ""}};
              int mode, row;
              String pkg, pin = "", first;
              boolean done, busy, modern;
              float d;
              LinearLayout col, dotRow;
              TextView sub;
              Dot[] dots = new Dot[4];
              Key[][] cells = new Key[4][3];

              int dp(int v) { return (int) (v * d + .5f); }

              static class Dot extends View {
                  final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
                  Dot(Context c) { super(c); set(0xFF2A3544); }
                  void set(int c) { p.setColor(c); invalidate(); }
                  @Override protected void onDraw(Canvas cv) {
                      float r = getWidth() / 2f;
                      cv.drawCircle(r, getHeight() / 2f, r, p);
                  }
              }

              static class Key extends View {
                  final Paint bg = new Paint(Paint.ANTI_ALIAS_FLAG), tx = new Paint(Paint.ANTI_ALIAS_FLAG);
                  final String label;
                  int tone;
                  Key(Context c, String l, float ts) {
                      super(c);
                      label = l;
                      tx.setColor(Color.WHITE);
                      tx.setTextSize(ts);
                      tx.setTextAlign(Paint.Align.CENTER);
                  }
                  @Override protected void drawableStateChanged() {
                      super.drawableStateChanged();
                      invalidate();
                  }
                  @Override protected void onDraw(Canvas cv) {
                      int c = (isFocused() || isPressed() || tone == 2) ? 0xFF3D8BFF : tone == 1 ? 0xFF24456F : 0xFF1B2430;
                      bg.setColor(c);
                      float r = getWidth() / 2f, y = getHeight() / 2f;
                      cv.drawCircle(r, y, r, bg);
                      cv.drawText(label, r, y - (tx.ascent() + tx.descent()) / 2f, tx);
                  }
              }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  d = getResources().getDisplayMetrics().density;
                  modern = Store.modern(this);
                  mode = getIntent().getIntExtra("m", UNLOCK);
                  pkg = getIntent().getStringExtra("p");
                  String title = "Lock", subText = "Şifreyi gir";
                  if (mode == UNLOCK && pkg != null) {
                      try {
                          PackageManager pm = getPackageManager();
                          title = pm.getApplicationLabel(pm.getApplicationInfo(pkg, 0)).toString();
                      } catch (Exception e) { }
                  } else if (mode >= CREATE) {
                      title = "Yeni şifre";
                      subText = "4 haneli bir şifre belirle";
                  }

                  FrameLayout root = new FrameLayout(this);
                  col = new LinearLayout(this);
                  col.setOrientation(LinearLayout.VERTICAL);
                  col.setGravity(Gravity.CENTER);
                  root.addView(col, new FrameLayout.LayoutParams(-1, -1));

                  TextView t = new TextView(this);
                  t.setText(title);
                  t.setTextSize(30);
                  t.setTextColor(Color.WHITE);
                  t.setGravity(Gravity.CENTER);
                  col.addView(t);

                  sub = new TextView(this);
                  sub.setText(subText);
                  sub.setTextSize(16);
                  sub.setTextColor(0xFF8A98AA);
                  sub.setGravity(Gravity.CENTER);
                  LinearLayout.LayoutParams sp = new LinearLayout.LayoutParams(-2, -2);
                  sp.setMargins(0, dp(4), 0, dp(14));
                  col.addView(sub, sp);

                  dotRow = new LinearLayout(this);
                  dotRow.setGravity(Gravity.CENTER);
                  for (int i = 0; i < 4; i++) {
                      Dot v = new Dot(this);
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(dp(14), dp(14));
                      lp.setMargins(dp(9), 0, dp(9), 0);
                      dotRow.addView(v, lp);
                      dots[i] = v;
                  }
                  LinearLayout.LayoutParams dl = new LinearLayout.LayoutParams(-2, -2);
                  dl.setMargins(0, 0, 0, dp(14));
                  col.addView(dotRow, dl);

                  float ts = 26 * getResources().getDisplayMetrics().scaledDensity;
                  for (int r = 0; r < 4; r++) {
                      LinearLayout line = new LinearLayout(this);
                      line.setGravity(Gravity.CENTER);
                      for (int c = 0; c < 3; c++) {
                          final String k = ROWS[r][c];
                          View v;
                          if (k.isEmpty()) {
                              v = new View(this);
                          } else {
                              Key key = new Key(this, k, ts);
                              key.setOnClickListener(x -> press(k));
                              // Tıklanabilir görünümler Android 8+ sürümünde otomatik odaklanabilir olur;
                              // modern modda odak sadece bizim satır işaretimizdir.
                              key.setFocusable(!modern);
                              if (!modern) {
                                  key.setOnFocusChangeListener((x, f) ->
                                          x.animate().scaleX(f ? 1.12f : 1f).scaleY(f ? 1.12f : 1f).setDuration(80).start());
                              }
                              cells[r][c] = key;
                              v = key;
                          }
                          LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(dp(64), dp(64));
                          lp.setMargins(dp(6), dp(6), dp(6), dp(6));
                          line.addView(v, lp);
                      }
                      col.addView(line);
                  }

                  TextView c = new TextView(this);
                  c.setText("Yapımcı:Veysel Alemdar");
                  c.setTextSize(14);
                  c.setTextColor(0xFF6B7788);
                  FrameLayout.LayoutParams cp = new FrameLayout.LayoutParams(-2, -2, Gravity.BOTTOM | Gravity.CENTER_HORIZONTAL);
                  cp.bottomMargin = dp(14);
                  root.addView(c, cp);

                  setContentView(root);
                  if (modern) mark(); else cells[1][1].requestFocus();

                  col.setAlpha(0f);
                  col.setScaleX(.94f);
                  col.setScaleY(.94f);
                  col.animate().alpha(1f).scaleX(1f).scaleY(1f).setDuration(140).start();
                  overridePendingTransition(0, 0);
              }

              // Modern mod: aktif satırın sol/orta/sağ tuşları vurgulanır.
              void mark() {
                  for (int r = 0; r < 4; r++) {
                      for (int c = 0; c < 3; c++) {
                          Key k = cells[r][c];
                          if (k != null) {
                              k.tone = r == row ? (c == 1 ? 2 : 1) : 0;
                              k.invalidate();
                          }
                      }
                  }
              }

              void paint() {
                  for (int i = 0; i < 4; i++) dots[i].set(i < pin.length() ? Color.WHITE : 0xFF2A3544);
              }

              void press(String k) {
                  if (done || busy || k.isEmpty()) return;
                  if (k.equals("←")) {
                      if (!pin.isEmpty()) {
                          pin = pin.substring(0, pin.length() - 1);
                          paint();
                      }
                      return;
                  }
                  if (pin.length() >= 4) return;
                  pin += k;
                  paint();
                  View dv = dots[pin.length() - 1];
                  dv.setScaleX(.5f);
                  dv.setScaleY(.5f);
                  dv.animate().scaleX(1f).scaleY(1f).setDuration(90).start();
                  if (pin.length() == 4) {
                      busy = true;
                      col.postDelayed(this::submit, 90);
                  }
              }

              void submit() {
                  String p = pin;
                  if (mode == UNLOCK || mode == VERIFY) {
                      if (Store.check(this, p)) ok(); else bad("Yanlış şifre");
                  } else if (first == null) {
                      first = p;
                      pin = "";
                      paint();
                      sub.setText("Şifreyi tekrar gir");
                      busy = false;
                  } else if (first.equals(p)) {
                      Store.setPin(this, p);
                      ok();
                  } else {
                      first = null;
                      bad("Eşleşmedi, baştan dene");
                  }
              }

              void ok() {
                  done = true;
                  for (Dot x : dots) x.set(0xFF35D07F);
                  if (mode == UNLOCK) {
                      LockService.unlocked = pkg;
                      LockService.showing = false;
                      LockService sv = LockService.inst;
                      if (sv != null) sv.widen();
                  }
                  setResult(RESULT_OK);
                  if (mode == CREATE_FIRST) {
                      SettingsActivity.fresh = true;
                      startActivity(new Intent(this, SettingsActivity.class));
                  }
                  col.animate().alpha(0f).setDuration(110).withEndAction(() -> {
                      finish();
                      overridePendingTransition(0, 0);
                  }).start();
              }

              void bad(String m) {
                  for (Dot x : dots) x.set(0xFFFF5A5F);
                  sub.setText(m);
                  ObjectAnimator a = ObjectAnimator.ofFloat(dotRow, "translationX", 0, -dp(14), dp(14), -dp(10), dp(10), 0);
                  a.setDuration(260);
                  a.addListener(new AnimatorListenerAdapter() {
                      @Override
                      public void onAnimationEnd(Animator x) {
                          pin = "";
                          paint();
                          busy = false;
                      }
                  });
                  a.start();
              }

              @Override
              public boolean onKeyDown(int k, KeyEvent e) {
                  boolean first = e.getRepeatCount() == 0;
                  if (k >= KeyEvent.KEYCODE_0 && k <= KeyEvent.KEYCODE_9) {
                      if (first) press(String.valueOf(k - KeyEvent.KEYCODE_0));
                      return true;
                  }
                  if (k >= KeyEvent.KEYCODE_NUMPAD_0 && k <= KeyEvent.KEYCODE_NUMPAD_9) {
                      if (first) press(String.valueOf(k - KeyEvent.KEYCODE_NUMPAD_0));
                      return true;
                  }
                  if (k == KeyEvent.KEYCODE_DEL || k == KeyEvent.KEYCODE_FORWARD_DEL) {
                      if (first) press("←");
                      return true;
                  }
                  if (modern) {
                      switch (k) {
                          case KeyEvent.KEYCODE_DPAD_LEFT:
                              if (first) press(ROWS[row][0]);
                              return true;
                          case KeyEvent.KEYCODE_DPAD_CENTER:
                          case KeyEvent.KEYCODE_ENTER:
                          case KeyEvent.KEYCODE_NUMPAD_ENTER:
                              if (first) press(ROWS[row][1]);
                              return true;
                          case KeyEvent.KEYCODE_DPAD_RIGHT:
                              if (first) press(ROWS[row][2]);
                              return true;
                          case KeyEvent.KEYCODE_DPAD_UP:
                              row = (row + 3) & 3;
                              mark();
                              return true;
                          case KeyEvent.KEYCODE_DPAD_DOWN:
                              row = (row + 1) & 3;
                              mark();
                              return true;
                          default:
                              break;
                      }
                  }
                  return super.onKeyDown(k, e);
              }

              void goHome() {
                  try {
                      startActivity(new Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_HOME)
                              .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK));
                  } catch (Exception e) { }
              }

              @Override
              public void onBackPressed() {
                  if (mode == UNLOCK) {
                      LockService.showing = false;
                      goHome();
                  }
                  finish();
                  overridePendingTransition(0, 0);
              }

              @Override
              protected void onStop() {
                  super.onStop();
                  if (mode == UNLOCK) LockService.showing = false;
                  if (!done && !isFinishing()) {
                      if (mode == UNLOCK) goHome();
                      finish();
                  }
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  if (mode == UNLOCK) LockService.showing = false;
              }
          }
          EOF_X
          cat > p/app/src/main/java/com/vys/lock/SettingsActivity.java <<'EOF_X'
          package com.vys.lock;

          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.widget.ArrayAdapter;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ListView;
          import android.widget.TextView;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.HashMap;
          import java.util.Map;
          import java.util.Set;

          public class SettingsActivity extends Activity {
              static volatile boolean fresh;
              boolean built, busy;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  if (fresh) {
                      fresh = false;
                      build();
                      return;
                  }
                  startActivityForResult(new Intent(this, PinActivity.class)
                          .putExtra("m", Store.hasPin(this) ? PinActivity.VERIFY : PinActivity.CREATE), 1);
                  overridePendingTransition(0, 0);
              }

              @Override
              protected void onActivityResult(int rq, int rs, Intent data) {
                  if (rq == 1) {
                      if (rs == RESULT_OK) build(); else finish();
                  } else {
                      busy = false;
                  }
              }

              @Override
              protected void onStop() {
                  super.onStop();
                  if (built && !busy && !isFinishing()) finish();
              }

              String modeText() { return Store.modern(this) ? "Mod: Modern" : "Mod: Klasik"; }

              void build() {
                  built = true;
                  float d = getResources().getDisplayMetrics().density;
                  int pad = (int) (28 * d);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(pad, pad / 2, pad, pad / 2);

                  TextView t = new TextView(this);
                  t.setText("Lock");
                  t.setTextSize(28);
                  t.setTextColor(Color.WHITE);
                  root.addView(t);

                  TextView s = new TextView(this);
                  s.setText("Kilitlenecek uygulamaları seç");
                  s.setTextSize(15);
                  s.setTextColor(0xFF8A98AA);
                  root.addView(s);

                  LinearLayout bar = new LinearLayout(this);
                  Button bt = new Button(this);
                  bt.setText("Şifreyi değiştir");
                  bt.setOnClickListener(v -> {
                      busy = true;
                      startActivityForResult(new Intent(this, PinActivity.class).putExtra("m", PinActivity.CREATE), 2);
                  });
                  bar.addView(bt, new LinearLayout.LayoutParams(-2, -2));
                  Button bm = new Button(this);
                  bm.setText(modeText());
                  bm.setOnClickListener(v -> {
                      Store.setModern(this, !Store.modern(this));
                      ((Button) v).setText(modeText());
                  });
                  bar.addView(bm, new LinearLayout.LayoutParams(-2, -2));
                  root.addView(bar, new LinearLayout.LayoutParams(-2, -2));

                  final ListView lv = new ListView(this);
                  root.addView(lv, new LinearLayout.LayoutParams(-1, 0, 1f));

                  TextView c = new TextView(this);
                  c.setText("Yapımcı:Veysel Alemdar");
                  c.setGravity(Gravity.CENTER);
                  c.setTextSize(13);
                  c.setTextColor(0xFF6B7788);
                  root.addView(c, new LinearLayout.LayoutParams(-1, -2));

                  setContentView(root);

                  // Uygulama listesi arka planda yüklenir, ekran anında açılır.
                  new Thread(() -> {
                      PackageManager pm = getPackageManager();
                      HashMap<String, String> m = new HashMap<String, String>();
                      String[] cats = {Intent.CATEGORY_LAUNCHER, Intent.CATEGORY_LEANBACK_LAUNCHER};
                      for (String cat : cats) {
                          for (ResolveInfo r : pm.queryIntentActivities(new Intent(Intent.ACTION_MAIN).addCategory(cat), 0)) {
                              String pk = r.activityInfo.packageName;
                              if (!pk.equals(getPackageName())) m.put(pk, r.loadLabel(pm).toString());
                          }
                      }
                      final ArrayList<String[]> apps = new ArrayList<String[]>();
                      for (Map.Entry<String, String> e : m.entrySet()) apps.add(new String[]{e.getValue(), e.getKey()});
                      Collections.sort(apps, (x, y) -> x[0].compareToIgnoreCase(y[0]));
                      final String[] names = new String[apps.size()];
                      for (int n = 0; n < names.length; n++) names[n] = apps.get(n)[0];
                      runOnUiThread(() -> {
                          if (isFinishing()) return;
                          lv.setChoiceMode(ListView.CHOICE_MODE_MULTIPLE);
                          lv.setAdapter(new ArrayAdapter<String>(this, android.R.layout.simple_list_item_multiple_choice, names));
                          Set<String> sel = Store.locked(this);
                          for (int n = 0; n < names.length; n++) lv.setItemChecked(n, sel.contains(apps.get(n)[1]));
                          lv.setOnItemClickListener((a, v, pos, id) -> {
                              Set<String> cur = Store.locked(this);
                              if (lv.isItemChecked(pos)) cur.add(apps.get(pos)[1]); else cur.remove(apps.get(pos)[1]);
                              Store.setLocked(this, cur);
                          });
                      });
                  }).start();
              }
          }
          EOF_X
          cat > p/app/src/main/java/com/vys/lock/Store.java <<'EOF_X'
          package com.vys.lock;

          import android.content.Context;
          import android.content.SharedPreferences;
          import java.security.MessageDigest;
          import java.util.HashSet;
          import java.util.Set;

          final class Store {
              static volatile Set<String> cache;

              static SharedPreferences p(Context c) { return c.getSharedPreferences("s", 0); }

              static boolean hasPin(Context c) { return p(c).contains("h"); }

              static String hash(String pin) {
                  try {
                      byte[] b = MessageDigest.getInstance("SHA-256").digest(("vys-lock:" + pin).getBytes("UTF-8"));
                      String h = "0123456789abcdef";
                      char[] o = new char[b.length * 2];
                      for (int i = 0; i < b.length; i++) {
                          o[2 * i] = h.charAt((b[i] >> 4) & 15);
                          o[2 * i + 1] = h.charAt(b[i] & 15);
                      }
                      return new String(o);
                  } catch (Exception e) { return ""; }
              }

              static void setPin(Context c, String pin) { p(c).edit().putString("h", hash(pin)).apply(); }

              static boolean check(Context c, String pin) { return hash(pin).equals(p(c).getString("h", "")); }

              static boolean modern(Context c) { return p(c).getBoolean("md", false); }

              static void setModern(Context c, boolean b) { p(c).edit().putBoolean("md", b).apply(); }

              static Set<String> load(Context c) {
                  Set<String> s = cache;
                  if (s == null) {
